# Copy to application-local-secret.yml locally; never commit real credentials.
STAR_RAIN_DB_URL: jdbc:mysql://127.0.0.1:3306/star_rain_v2?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
STAR_RAIN_DB_USERNAME: replace_me
STAR_RAIN_DB_PASSWORD: replace_me
STAR_RAIN_SMTP_HOST: replace_me
STAR_RAIN_SMTP_PORT: 465
STAR_RAIN_SMTP_USERNAME: replace_me
STAR_RAIN_SMTP_PASSWORD: replace_me
STAR_RAIN_SMTP_AUTH: true
STAR_RAIN_SMTP_SSL: true
STAR_RAIN_SMTP_ENABLED: true
# Transactional email sender only; this does not identify the administrator.
STAR_RAIN_MAIL_FROM: replace_me
STAR_RAIN_FRONTEND_ORIGIN: http://127.0.0.1:5174
STAR_RAIN_BOOTSTRAP_ADMIN_ENABLED: true
STAR_RAIN_BOOTSTRAP_ADMIN_USERNAME: v2_admin
# Administrator identity mailbox, configured independently from the SMTP sender.
STAR_RAIN_BOOTSTRAP_ADMIN_EMAIL: replace_me
STAR_RAIN_BOOTSTRAP_ADMIN_PASSWORD: replace_with_random_password_at_least_12_chars





