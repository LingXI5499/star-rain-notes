<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>标签、元素与属性</title>
</head>
<body>
  <h1>我的第一张网页</h1>
  <!-- note 只是类名；当前页面没有为它设置样式。 -->
  <p class="note" title="把鼠标停在这里">这是一个段落。</p>
  <p>这是另一个段落。</p>
</body>
</html>
