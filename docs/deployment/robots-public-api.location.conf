# Replace the existing `location = /robots.txt` block in the site's server configuration.
# Public JSON endpoints are needed to render the reading pages after Vue mounts.
# The application still enforces authentication and authorization on private endpoints.
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\nAllow: /api/public/\nDisallow: /api/\nDisallow: /useradmin/\nDisallow: /search\nSitemap: https://yulanlin.cn/sitemap.xml\n";
}
