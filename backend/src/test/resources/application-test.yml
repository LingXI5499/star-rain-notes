# 测试 profile（只含可覆盖的本机默认值，不保存生产凭据）。
# 由数据库集成测试 @ActiveProfiles("test") 激活；Flyway 在测试上下文启动时
# 对测试数据库执行全部迁移。CI/其他开发机通过 TEST_MYSQL_* 覆盖。
spring:
  datasource:
    url: jdbc:mysql://${TEST_MYSQL_HOST:127.0.0.1}:${TEST_MYSQL_PORT:3306}/${TEST_MYSQL_DATABASE:star_rain_notes_test}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${TEST_MYSQL_USER:root}
    password: ${TEST_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  media:
    # 测试专用存储目录（target/ 下，mvn clean 自动清理，与开发 uploads 隔离）
    storage-dir: target/test-uploads
    public-base: /uploads
