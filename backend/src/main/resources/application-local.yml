# 由 application.yml 的 spring.profiles.default=local 自动激活。
spring:
  config:
    # 本机真实邮箱/授权码等私密配置写到 backend/application-local-secret.yml。
    # 该文件被 .gitignore 忽略：本机直接填真实值，但不会提交到仓库。
    import:
      # 从 backend 目录启动（IDEA 常见配置）。
      - optional:file:./application-local-secret.yml
      # 从仓库根目录使用 mvn -f backend/pom.xml 启动。
      - optional:file:./backend/application-local-secret.yml
