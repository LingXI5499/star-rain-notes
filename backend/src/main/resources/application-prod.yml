# Production profile (06-testing-deployment.md §9) — secret-free template.
#
# Everything here is either a prod-only default or reads from the
# environment. Secrets (MYSQL_PASSWORD, APP_SETUP_TOKEN, ...) are injected at
# runtime via the systemd EnvironmentFile (deploy/env/star-rain-notes.env.example
# → /etc/star-rain-notes/star-rain-notes.env) and never committed to Git.
#
# Activate with:  --spring.profiles.active=prod  (SPRING_PROFILES_ACTIVE=prod)
server:
  # The Java service is reachable only through the local Nginx reverse proxy.
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  # Respect X-Forwarded-* supplied by the local Nginx reverse proxy.
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:32}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:4}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}
  servlet:
    session:
      cookie:
        # Production runs behind HTTPS: the session cookie must be Secure.
        # Override with SESSION_COOKIE_SECURE=false only for non-TLS smoke runs.
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  datasource:
    hikari:
      # A two-core personal ECS does not benefit from a large JDBC pool. A
      # small bounded pool leaves memory and connections available to MySQL.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1500000
  lifecycle:
    timeout-per-shutdown-phase: 25s

app:
  seo:
    frontend-index-path: ${SEO_FRONTEND_INDEX_PATH:/www/wwwroot/yulanlin.cn/index.html}
  # The pre-account username login granted ROLE_SUPER_ADMIN and is retained
  # only for local compatibility. It must never be an alternate production login.
  legacy-admin-login-enabled: false
  legacy-setup-enabled: false
  media:
    # Absolute media directory served by Nginx at /uploads (06 §8); the DB
    # keeps only the relative storage key.
    storage-dir: ${MEDIA_STORAGE_DIR:/www/wwwroot/yulanlin.cn/uploads}

# API documentation is useful locally but should not consume memory or expose
# metadata on the public production host.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
