# Replace domain, root and certificate paths. With BaoTa, retain the existing certificate settings.
# Install nginx-http-log-format.conf in http {} before loading this server configuration.
server {
    listen 80;
    server_name notes.example.com;
    access_log /var/log/nginx/star-rain-access.log star_rain_safe;
    return 301 https://notes.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name notes.example.com;
    ssl_certificate /etc/nginx/certs/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/notes.example.com/privkey.pem;

    root /srv/star-rain/current/frontend/dist;
    index index.html;
    client_max_body_size 520m;
    access_log /var/log/nginx/star-rain-access.log star_rain_safe;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location ^~ /actuator/ { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy no-referrer always;
    }
    location ^~ /brand/ { try_files $uri =404; }
    location ^~ /legal/ { try_files $uri =404; }
    location = /build-info.json {
        try_files $uri =404;
        add_header Cache-Control no-cache;
        add_header Referrer-Policy no-referrer always;
    }
    location = /index.html {
        add_header Cache-Control no-cache;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/(useradmin(?:/|$)|english(?:/|$)|terms/?$|privacy/?$|search/?$) {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/portfolio/[^/]+/live/?$ {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
    }
    # Public HTML, robots and sitemap use backend SEO snapshots and retain real 404 responses.
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
