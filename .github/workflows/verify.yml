# verify.yml：持续集成流程定义。
# 定义前后端与自建技能的独立检查，不连接部署数据库。
# 工作流的显示名称；作业由下面的事件触发。
name: Verify
# 主分支、项目工作分支推送和 PR 执行检查，也支持手动触发。
on:
  push:
    branches: [main, 'LIngXI/**', 'LIngXI-*']
  pull_request:
  workflow_dispatch:
# 工作流令牌只有读取仓库内容权限。
permissions:
  contents: read
env:
  STAR_RAIN_BUILD_COMMIT: ${{ github.sha }}
# 同一工作流与分支只保留最新检查，避免重复消耗 CI 资源。
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# 前后端分别校验；后端使用独立数据库，不连接部署数据库。
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: star-rain-notes-site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: star-rain-notes-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # 技能包独立检查：验证 Python 脚本语法与文章结构检查器，不生成发布或部署产物。
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check skill script syntax
        run: python3 -m compileall -q skills
      - name: Test algorithm article validator
        run: python3 skills/star-rain-algorithm-blog/scripts/test_validate_article.py
      - name: Test tutorial chapter validator
        run: python3 skills/star-rain-tutorial-authoring/scripts/test_validate_chapter_structure.py
      - run: python3 -m pip install -r tools/requirements-audit.txt
      - run: python3 tools/test_validate_deployment_config.py
      - run: python3 tools/validate_deployment_config.py backend/star-rain-boot/src/main/resources/application.yml
  # 前端 CI：安装锁定依赖，执行测试与生产构建。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # shell 步骤的默认工作目录；uses 动作不受此目录配置影响。
    defaults:
      run:
        working-directory: frontend
    # 步骤按顺序执行；数据库迁移完成后再运行依赖数据库的测试。
    steps:
      # 检出当前提交；不持久化访问令牌到 Git 配置。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 安装 Node 24 并按 package-lock 缓存 npm 下载内容。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 严格按锁文件安装依赖，避免 CI 与本机构建版本漂移。
      - run: npm ci
      # 执行前端单元与组件测试；失败则终止当前作业。
      - run: npm test
      # 验证生产构建可完成；产物仅包含前端资源。
      - run: npm run build
      - run: node ../tools/check_frontend_budget.mjs
      - run: npm audit --audit-level=high
  # 后端 CI：打包、迁移独立数据库、运行完整测试并检查跳过数量。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Check reading layout with production CSS
        run: npm run test:e2e -- e2e/reading-layout.spec.js
        env:
          STAR_RAIN_E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-regression-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 作业专用 MySQL 容器；健康检查通过后才开始执行步骤。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated_ci_only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: star_rain_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    # 仅供隔离 CI 使用的环境值；禁用发信、管理员初始化、索引通知和孤儿清理。
    env:
      STAR_RAIN_DB_URL: jdbc:mysql://127.0.0.1:3306/star_rain_ci?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
      STAR_RAIN_DB_USERNAME: root
      STAR_RAIN_DB_PASSWORD: isolated_ci_only
      STAR_RAIN_SMTP_ENABLED: 'false'
      STAR_RAIN_INDEXNOW_ENABLED: 'false'
      STAR_RAIN_BOOTSTRAP_ADMIN_ENABLED: 'false'
      STAR_RAIN_MEDIA_ORPHAN_CLEANUP: 'false'
    # shell 步骤的默认工作目录；uses 动作不受此目录配置影响。
    defaults:
      run:
        working-directory: backend
    # 步骤按顺序执行；数据库迁移完成后再运行依赖数据库的测试。
    steps:
      # 检出当前提交；不持久化访问令牌到 Git 配置。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 安装 Temurin JDK 21 并缓存 Maven 下载内容。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 扫描已跟踪的源文件范围和隐私特征，失败只报告路径与行号。
      - name: Check public source
        run: python3 tools/check_public_source.py
      # 先生成用于迁移的可运行应用；此步骤不执行测试。
      - name: Package application for test database migrations
        run: mvn -B -DskipTests package
      # 临时启动应用执行 Flyway，轮询公开配置接口；退出时清理该临时进程。
      - name: Migrate isolated database
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx256m -jar star-rain-boot/target/star-rain-boot-2.0.1.jar > "$RUNNER_TEMP/migration.log" 2>&1 &
          application_pid=$!
          trap 'kill "$application_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/api/public/site/config > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$application_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/migration.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/migration.log"
          exit 1
      # 迁移成功后运行 Maven 完整验证，包括数据库行为测试。
      - run: mvn -B verify
      # 汇总 Surefire 报告；任何测试被跳过都会使 CI 失败。
      - name: Require database coverage
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('.').glob('*/target/surefire-reports/TEST-*.xml'))
          assert reports, 'No test reports'
          skipped = sum(int(ET.parse(path).getroot().get('skipped', '0')) for path in reports)
          assert skipped == 0, f'{skipped} tests skipped; check database setup'
          PY

  real-backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated_ci_only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: star_rain_real_e2e
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      STAR_RAIN_DB_URL: jdbc:mysql://127.0.0.1:3306/star_rain_real_e2e?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
      STAR_RAIN_DB_USERNAME: root
      STAR_RAIN_DB_PASSWORD: isolated_ci_only
      STAR_RAIN_SMTP_ENABLED: 'true'
      STAR_RAIN_SMTP_HOST: 127.0.0.1
      STAR_RAIN_SMTP_PORT: '12525'
      STAR_RAIN_SMTP_AUTH: 'false'
      STAR_RAIN_SMTP_SSL: 'false'
      STAR_RAIN_SMTP_STARTTLS: 'false'
      STAR_RAIN_MAIL_FROM: account-e2e@example.test
      STAR_RAIN_INDEXNOW_ENABLED: 'false'
      STAR_RAIN_MEDIA_ORPHAN_CLEANUP: 'false'
      STAR_RAIN_BOOTSTRAP_ADMIN_ENABLED: 'true'
      STAR_RAIN_BOOTSTRAP_ADMIN_USERNAME: isolated_e2e_admin
      STAR_RAIN_BOOTSTRAP_ADMIN_EMAIL: isolated-e2e@example.test
      STAR_RAIN_E2E_USERNAME: isolated_e2e_admin
      STAR_RAIN_E2E_REAL: 'true'
      STAR_RAIN_FRONTEND_ORIGIN: http://127.0.0.1:5189
      STAR_RAIN_API_TARGET: http://127.0.0.1:8088
      STAR_RAIN_MEDIA_ROOT: /tmp/star-rain-e2e-media
    steps:
      - name: Generate isolated browser credentials
        shell: bash
        run: |
          mail_key=$(openssl rand -base64 32)
          echo "::add-mask::$mail_key"
          echo "STAR_RAIN_MAIL_OUTBOX_KEY=$mail_key" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "STAR_RAIN_BOOTSTRAP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "STAR_RAIN_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: mvn -B -Dmaven.test.skip=true package
        working-directory: backend
      - name: Real browser and backend integration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx384m -jar star-rain-boot/target/star-rain-boot-2.0.1.jar > "$RUNNER_TEMP/real-e2e-backend.log" 2>&1 &
          application_pid=$!
          trap 'kill "$application_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18089/actuator/health/readiness >/dev/null; then break; fi
            if ! kill -0 "$application_pid" 2>/dev/null; then cat "$RUNNER_TEMP/real-e2e-backend.log"; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18089/actuator/health/readiness >/dev/null
          cd ../frontend
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: real-e2e-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
