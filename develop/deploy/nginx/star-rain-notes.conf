# Star Rain Notes V1 — Nginx site (06-testing-deployment.md §8)
#
# Install:
#   sudo cp deploy/nginx/star-rain-notes.conf /etc/nginx/sites-available/star-rain-notes.conf
#   sudo ln -s /etc/nginx/sites-available/star-rain-notes.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every "example.com" with the real domain, and obtain TLS
# certificates (e.g. certbot). NEVER commit the private key (deploy/.gitignore
# covers *.key / *.pem / .env).

upstream star_rain_backend {
    server 127.0.0.1:24680;
    keepalive 8;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Let's Encrypt HTTP-01 challenge directory (optional, if using certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # TLS — paths replaced at install time; keep the key out of Git
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Low-resource static delivery: compress text once at the edge and keep
    # large JS/CSS/JSON responses off the wire. Hashed assets are immutable.
    sendfile on;
    tcp_nopush on;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/problem+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Spring multipart cap is 55MB; business validation still limits audio to
    # 50MB, PDF to 20MB and images to 10MB.
    client_max_body_size 55m;
    client_body_timeout 30s;

    # Security headers (06 §8: nosniff required)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- Vue SPA (frontend/dist content) ----------
    root /srv/star-rain-notes/web;
    index index.html;
    charset utf-8;

    # Hashed build assets: immutable, and a missing asset is a real 404
    # (not a 200 with index.html — 06 §13).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---------- Backend API reverse proxy (Spring Boot :24680) ----------
    location /api/ {
        proxy_pass http://star_rain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Health probe — only exposes {"status":"UP"} (06 §12)
    location /actuator/health {
        proxy_pass http://star_rain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---------- Public media (non-executable directory) ----------
    # Directories keep their traversal bit; regular upload files have no
    # execute bit. The Nginx worker receives read access through the shared
    # starrain group, while the application is the only writer.
    location /uploads/ {
        alias /srv/star-rain-notes/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        limit_except GET HEAD { deny all; }
    }

    # The HTML shell must always revalidate so a deployment cannot leave
    # browsers pointing at asset hashes from the previous release.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---------- SPA history-router fallback ----------
    # Unknown client-side routes render the Vue 404 page (which carries
    # robots noindex); API and static misses above return real 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles (e.g. .env backups accidentally dropped into web root)
    location ~ /\. {
        deny all;
    }
}
