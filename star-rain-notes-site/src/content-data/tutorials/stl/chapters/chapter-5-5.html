<h2>本章知识点</h2>
<ul>
<li>rehash invalidates iterators</li>
<li>references / pointers to elements 的标准稳定性边界</li>
<li>erase invalidates erased element</li>
<li>insert may trigger rehash</li>
<li>保存 iterator 后继续插入的风险</li>
<li>loop mutation</li>
<li>reserve 可以减少 rehash 次数</li>
<li>concurrency 仍不安全</li>
<li>iterator invalidation 与 vector 的原因不同</li>
</ul>
