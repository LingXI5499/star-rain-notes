<h2>本章知识点</h2>
<ul>

<li>教学基线：Python 3.14 系列；当前核验维护版本为 3.14.7</li>
<li>学习路径：基础语法 → 内置类型 → 函数 → 模块 → 异常/IO → OOP → 迭代器/生成器 → 类型系统 → 并发 → 工程与运行时</li>
<li>Python 语言、CPython 实现、标准库、PyPI 第三方生态的边界</li>
<li>Python 与数据结构算法、Web 框架、数据分析、AI/Agent 课程的边界</li>
<li>学习方法：解释器实验、单元测试、类型检查、调试、性能测量与源码阅读</li>
</ul>
