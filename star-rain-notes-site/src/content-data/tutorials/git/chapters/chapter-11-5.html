<h2>本章知识点</h2>
<ul>
<li>main should be stable</li>
<li>non-fast-forward</li>
<li>force update</li>
<li>direct push</li>
<li>review gate</li>
<li>CI gate</li>
<li>signed commit</li>
<li>branch protection is hosting platform feature</li>
<li>Git 本身不会自动阻止仓库管理员修改 ref</li>
<li>团队流程需要 Git + 平台治理共同完成</li>
</ul>
