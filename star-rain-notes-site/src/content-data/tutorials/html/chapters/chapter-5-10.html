<p><strong>核心：</strong> <code>img</code> 用于普通图片，内联 <code>svg</code> 用于矢量图；多媒体资源可放进语义容器。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;figure&gt;
  &lt;svg width="50" height="50"&gt;&lt;circle cx="25" cy="25" r="20" fill="orange"/&gt;&lt;/svg&gt;
  &lt;figcaption&gt;一个圆形矢量图&lt;/figcaption&gt;
&lt;/figure&gt;
</code></pre>
<p><strong>学完能做：</strong> 区分图片、SVG 与多媒体展示容器的职责。</p>
