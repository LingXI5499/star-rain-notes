<p><strong>核心：</strong> GET 表单把字段放到 URL 查询串；搜索通常用 <code>method="get"</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;form action="/search" method="get"&gt;
  &lt;input name="q" placeholder="输入关键字"&gt;
  &lt;button&gt;搜索&lt;/button&gt;
&lt;/form&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用 GET 查询参数构建可用的搜索表单。</p>
