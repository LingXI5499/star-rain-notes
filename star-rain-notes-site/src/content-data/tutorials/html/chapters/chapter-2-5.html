<p><strong>核心：</strong> <code>img</code> 的 <code>src</code> 定位图片、<code>alt</code> 描述图片；<code>figure</code>/<code>figcaption</code> 关联图和图注。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;figure&gt;
  &lt;img src="moon.jpg" alt="夜空中的月亮"&gt;
  &lt;figcaption&gt;夜空摄影&lt;/figcaption&gt;
&lt;/figure&gt;
</code></pre>
<p><strong>学完能做：</strong> 插入图片并设置替代文本与图注。</p>
