<p><strong>核心：</strong> <code>progress</code> 表示任务进度；<code>meter</code> 表示有边界的测量值。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;progress value="60" max="100"&gt;60%&lt;/progress&gt;
&lt;meter value="0.7" min="0" max="1"&gt;70%&lt;/meter&gt;
</code></pre>
<p><strong>学完能做：</strong> 区分任务进度与区间测量的适用场景。</p>
