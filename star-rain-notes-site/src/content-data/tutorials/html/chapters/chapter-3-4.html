<p><strong>核心：</strong> <code>colspan</code> 横跨多列、<code>rowspan</code> 纵跨多行；<code>scope</code> 指明行/列表头。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;table&gt;
  &lt;tr&gt;&lt;th scope="col"&gt;姓名&lt;/th&gt;&lt;th scope="col"&gt;分数&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;th scope="row"&gt;小明&lt;/th&gt;&lt;td&gt;90&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td colspan="2"&gt;合计一条记录&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
</code></pre>
<p><strong>学完能做：</strong> 实现跨行跨列并正确关联表头。</p>
