<p><strong>核心：</strong> <code>header</code>、<code>nav</code>、<code>main</code>、<code>section</code>、<code>article</code>、<code>aside</code>、<code>footer</code> 表达区域职责。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;header&gt;&lt;nav&gt;导航&lt;/nav&gt;&lt;/header&gt;
&lt;main&gt;&lt;article&gt;&lt;h1&gt;正文&lt;/h1&gt;&lt;/article&gt;&lt;aside&gt;相关推荐&lt;/aside&gt;&lt;/main&gt;
&lt;footer&gt;页脚&lt;/footer&gt;
</code></pre>
<p><strong>学完能做：</strong> 按页面职责选择 header、main、section 等结构标签。</p>
