<p><strong>核心：</strong> 表单 <code>action</code> 是提交地址、<code>method</code> 是请求方法；控件 <code>name</code> 决定字段名，<code>value</code> 决定字段值。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;form action="/search" method="get"&gt;
  &lt;input name="keyword" value="HTML"&gt;
  &lt;button type="submit"&gt;搜索&lt;/button&gt;
&lt;/form&gt;
</code></pre>
<p><strong>学完能做：</strong> 理解表单字段名、字段值与提交数据的关系。</p>
