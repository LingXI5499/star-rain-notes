<p><strong>核心：</strong> <code>template</code> 内的内容默认不渲染；脚本可克隆并插入 DOM。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;template id="itemTpl"&gt;&lt;li&gt;新项目&lt;/li&gt;&lt;/template&gt;
&lt;!-- JS: list.append(itemTpl.content.cloneNode(true)) --&gt;
</code></pre>
<p><strong>学完能做：</strong> 定义可由脚本克隆的 template 内容。</p>
