<p><strong>核心：</strong> <code>a</code> 用 <code>href</code> 指向链接；<code>nav</code> 包装导航；<code>#id</code> 跳到页面锚点。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;nav&gt;&lt;a href="#about"&gt;关于我们&lt;/a&gt;&lt;/nav&gt;
&lt;section id="about"&gt;&lt;h2&gt;关于我们&lt;/h2&gt;&lt;/section&gt;
</code></pre>
<p><strong>学完能做：</strong> 编写页面链接、导航链接和页内跳转。</p>
