<p><strong>核心：</strong> <code>title</code> 是标签页标题；<code>description</code> 为页面摘要元信息；<code>icon</code> 指定站点小图标。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;title&gt;星雨笔录&lt;/title&gt;
&lt;meta name="description" content="记录知识与作品"&gt;
&lt;link rel="icon" href="favicon.ico"&gt;
</code></pre>
<p><strong>学完能做：</strong> 设置网页标题、页面摘要与站点图标。</p>
