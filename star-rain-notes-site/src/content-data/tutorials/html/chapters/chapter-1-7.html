<p><strong>核心：</strong> 移动适配从 <code>viewport</code> 开始；<code>width=device-width</code> 让 CSS 视口与设备宽度对应。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
</code></pre>
<p><strong>学完能做：</strong> 配置 viewport，理解移动端视口对页面宽度的影响。</p>
