<p><strong>核心：</strong> <code>popover</code> 标记浮层，<code>popovertarget</code> 关联原生打开按钮。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;button popovertarget="tips"&gt;查看提示&lt;/button&gt;
&lt;div id="tips" popover&gt;请先填写资料&lt;/div&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用 Popover 建立原生浮层及其触发关系。</p>
