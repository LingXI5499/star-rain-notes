<p><strong>核心：</strong> <code>h1</code>~<code>h6</code> 表示标题层级；<code>p</code> 为段落；<code>span</code> 标记局部行内内容。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;h1&gt;教程标题&lt;/h1&gt;
&lt;h2&gt;第一章&lt;/h2&gt;
&lt;p&gt;这里有一段 &lt;span&gt;重点文字&lt;/span&gt;。&lt;/p&gt;
</code></pre>
<p><strong>学完能做：</strong> 合理选用标题层级、段落和基础文本标签。</p>
