<p><strong>标签：</strong> HTML 预先定义的标记，告诉浏览器内容类型。
<strong>元素：</strong> 通常由开始标签、内容、结束标签组成；也存在空元素。
<strong>属性：</strong> 写在开始标签内，为元素提供信息或配置。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;p class="note" id="intro"&gt;你好，HTML&lt;/p&gt;
</code></pre>
<p><strong>学完能做：</strong> 区分标签、元素和属性，正确书写基本标签。</p>
