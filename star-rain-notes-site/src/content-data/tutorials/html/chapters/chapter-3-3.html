<p><strong>核心：</strong> <code>table</code> 是表格；<code>tr</code> 为行、<code>th</code> 为表头单元格、<code>td</code> 为数据单元格。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;姓名&lt;/th&gt;&lt;th&gt;成绩&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;小明&lt;/td&gt;&lt;td&gt;95&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
</code></pre>
<p><strong>学完能做：</strong> 构建带表头、行和单元格的数据表。</p>
