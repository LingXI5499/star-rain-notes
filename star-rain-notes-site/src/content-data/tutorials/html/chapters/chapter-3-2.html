<p><strong>核心：</strong> <code>dl</code> 关联术语 <code>dt</code> 与解释 <code>dd</code>；<code>address</code> 表示联系人或作者联系信息。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;dl&gt;&lt;dt&gt;DOM&lt;/dt&gt;&lt;dd&gt;文档对象模型&lt;/dd&gt;&lt;/dl&gt;
&lt;address&gt;&lt;a href="mailto:hello@example.com"&gt;联系我们&lt;/a&gt;&lt;/address&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用描述列表表达术语及对应说明。</p>
