<p><strong>嵌套：</strong> 元素内可包含其他元素，形成树形结构。
<strong>父子：</strong> 直接包含与被包含的关系。
<strong>兄弟：</strong> 拥有同一个直接父元素。
<strong>祖先 / 后代：</strong> 沿包含关系向上 / 向下查找，包含直接父子。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;div&gt;
  &lt;p&gt;我是 div 的子元素&lt;/p&gt;
  &lt;span&gt;我和 p 是兄弟元素&lt;/span&gt;
&lt;/div&gt;
</code></pre>
<p><strong>学完能做：</strong> 识别父子与兄弟节点，画出简单嵌套结构。</p>
