<p><strong>核心：</strong> 常用控件：<code>input</code> 输入、<code>textarea</code> 多行、<code>button</code> 操作、<code>form</code> 提交。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;form&gt;
  &lt;input type="text" name="title"&gt;
  &lt;textarea name="note"&gt;&lt;/textarea&gt;
  &lt;button type="submit"&gt;保存&lt;/button&gt;
&lt;/form&gt;
</code></pre>
<p><strong>学完能做：</strong> 选择并组合输入框、按钮等常见原生控件。</p>
