<p><strong>核心：</strong> <code>video poster</code> 指定封面、<code>track</code> 提供字幕；视频与字幕文件先在本地准备好。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;video controls poster="cover.jpg" width="320"&gt;
  &lt;source src="lesson.mp4" type="video/mp4"&gt;
  &lt;track src="zh.vtt" kind="subtitles" srclang="zh" label="中文" default&gt;
&lt;/video&gt;
</code></pre>
<p><strong>学完能做：</strong> 了解本地视频文件、封面和字幕轨道的接入。</p>
