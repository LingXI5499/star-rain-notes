<p><strong>核心：</strong> 布尔属性只要存在即启用；<code>disabled</code>、<code>required</code>、<code>checked</code> 等不以字符串 <code>false</code> 表示关闭。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;input type="checkbox" checked&gt;
&lt;input type="text" required&gt;
&lt;button disabled&gt;不可点击&lt;/button&gt;
</code></pre>
<p><strong>学完能做：</strong> 识别 checked、disabled、required 等布尔属性的行为。</p>
