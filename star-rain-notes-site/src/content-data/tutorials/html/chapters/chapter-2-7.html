<p><strong>核心：</strong> 多个 HTML 文件通过 <code>a href</code> 互相访问，路径必须正确。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;!-- index.html --&gt;
&lt;a href="about.html"&gt;关于&lt;/a&gt;
&lt;!-- about.html --&gt;
&lt;a href="index.html"&gt;返回首页&lt;/a&gt;
</code></pre>
<p><strong>学完能做：</strong> 建立多页面之间的超链接导航。</p>
