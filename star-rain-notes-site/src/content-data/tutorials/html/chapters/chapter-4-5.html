<p><strong>核心：</strong> <code>type</code> 决定输入方式；<code>required</code>、<code>min</code>、<code>max</code>、<code>pattern</code> 等支持浏览器基础校验。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;input type="number" name="age" min="1" max="120" required&gt;
&lt;input type="email" name="email" required&gt;
</code></pre>
<p><strong>学完能做：</strong> 根据数据类型选择输入控件和内建校验。</p>
