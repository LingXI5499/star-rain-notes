<p><strong>核心：</strong> 将不同输入类型组合在一个 <code>form</code>，并为每个字段提供名称、校验规则。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;form action="/signup" method="post"&gt;
  &lt;label&gt;姓名 &lt;input name="name" required&gt;&lt;/label&gt;
  &lt;label&gt;邮箱 &lt;input type="email" name="email" required&gt;&lt;/label&gt;
  &lt;button&gt;提交&lt;/button&gt;
&lt;/form&gt;
</code></pre>
<p><strong>学完能做：</strong> 组合完成包含多种字段的信息采集页面。</p>
