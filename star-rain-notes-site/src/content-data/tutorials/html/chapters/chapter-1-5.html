<p><strong>核心：</strong> HTML 连续空格通常折叠；<code>br</code> 换行、<code>pre</code> 保留格式；特殊符号用实体，代码文本用 <code>code</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;p&gt;A&amp;nbsp;&amp;nbsp;B&lt;br&gt;下一行 &amp;lt;div&amp;gt;&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;const x = 1;&lt;/code&gt;&lt;/pre&gt;
</code></pre>
<p><strong>学完能做：</strong> 正确处理文本空白、换行、特殊字符和代码展示。</p>
