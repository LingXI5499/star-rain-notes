<p><strong>核心：</strong> <code>select</code>/<code>option</code> 用于选择；<code>datalist</code> 为输入提供建议；<code>output</code> 展示计算结果。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;select name="city"&gt;&lt;option&gt;太原&lt;/option&gt;&lt;option&gt;北京&lt;/option&gt;&lt;/select&gt;
&lt;input list="skills" name="skill"&gt;&lt;datalist id="skills"&gt;&lt;option value="Java"&gt;&lt;/datalist&gt;
&lt;output&gt;已选择&lt;/output&gt;
</code></pre>
<p><strong>学完能做：</strong> 选择下拉、建议选项和结果输出组件。</p>
