<p><strong>核心：</strong> 复杂表格用 <code>thead</code>/<code>tbody</code>/<code>tfoot</code> 分区，必要时用 <code>id</code> 与 <code>headers</code> 明确对应表头。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;table&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th id="product"&gt;商品&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;td headers="product"&gt;书籍&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
&lt;/table&gt;
</code></pre>
<p><strong>学完能做：</strong> 组织多级表头并保持数据可读性。</p>
