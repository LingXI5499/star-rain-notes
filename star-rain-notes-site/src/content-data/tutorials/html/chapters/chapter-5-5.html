<p><strong>核心：</strong> <code>dialog</code> 是原生对话框；<code>showModal()</code> 打开模态弹窗，<code>method="dialog"</code> 可关闭。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;dialog id="notice"&gt;&lt;form method="dialog"&gt;已保存&lt;button&gt;关闭&lt;/button&gt;&lt;/form&gt;&lt;/dialog&gt;
&lt;!-- JS: document.querySelector('#notice').showModal() --&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用 dialog 表达对话框并正确关闭。</p>
