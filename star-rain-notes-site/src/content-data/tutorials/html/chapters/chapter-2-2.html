<p><strong>核心：</strong> <code>strong</code> 表重要、<code>em</code> 表强调；<code>blockquote</code> 是块引用，<code>q</code> 是行内引用。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;p&gt;&lt;strong&gt;警告&lt;/strong&gt;：请&lt;em&gt;认真&lt;/em&gt;阅读。&lt;/p&gt;
&lt;blockquote&gt;学而时习之。&lt;/blockquote&gt;
</code></pre>
<p><strong>学完能做：</strong> 区分强调、引用与纯视觉效果的语义。</p>
