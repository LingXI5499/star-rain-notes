<p><strong>核心：</strong> <code>picture</code> 按条件选资源；<code>srcset</code> 为不同尺寸提供候选图片。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;picture&gt;
  &lt;source media="(max-width: 600px)" srcset="small.jpg"&gt;
  &lt;img src="large.jpg" alt="星空"&gt;
&lt;/picture&gt;
</code></pre>
<p><strong>学完能做：</strong> 按不同显示条件提供合适的图片资源。</p>
