<p><strong>核心：</strong> 浏览器能验证单个字段，但两次密码是否相等需要 JavaScript 做跨字段校验。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;input id="pwd" type="password" minlength="8"&gt;
&lt;input id="confirm" type="password" minlength="8"&gt;
&lt;!-- JS 检查：pwd.value === confirm.value --&gt;
</code></pre>
<p><strong>学完能做：</strong> 理解确认密码等跨字段规则需要脚本补充。</p>
