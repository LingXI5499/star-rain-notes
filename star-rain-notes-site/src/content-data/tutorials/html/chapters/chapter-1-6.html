<p><strong>核心：</strong> <code>id</code> 唯一标识、<code>class</code> 可复用分类、<code>title</code> 提示、<code>data-*</code> 存自定义数据。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;button id="save" class="btn" title="保存" data-state="draft"&gt;保存&lt;/button&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用 id、class、title、data-* 等全局属性。</p>
