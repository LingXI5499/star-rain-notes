<p><strong>核心：</strong> <code>details</code>/<code>summary</code> 实现不依赖 JS 的展开与收起。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;details&gt;&lt;summary&gt;查看答案&lt;/summary&gt;&lt;p&gt;答案是 42。&lt;/p&gt;&lt;/details&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用 details 与 summary 实现无需脚本的折叠。</p>
