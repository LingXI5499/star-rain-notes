<p><strong>核心：</strong> <code>label for</code> 关联控件 <code>id</code>；<code>fieldset</code> 包含一组输入项，<code>legend</code> 给分组命名。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;fieldset&gt;
  &lt;legend&gt;账户&lt;/legend&gt;
  &lt;label for="email"&gt;邮箱&lt;/label&gt;
  &lt;input id="email" type="email" name="email"&gt;
&lt;/fieldset&gt;
</code></pre>
<p><strong>学完能做：</strong> 为输入项建立标签与逻辑分组。</p>
