<p><strong>核心：</strong> 用 <code>ol</code> 表步骤，<code>ul</code> 表子任务；列表可以嵌套进 <code>li</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;ol&gt;
  &lt;li&gt;创建项目&lt;ul&gt;&lt;li&gt;新建文件夹&lt;/li&gt;&lt;li&gt;创建 index.html&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;
  &lt;li&gt;打开浏览器&lt;/li&gt;
&lt;/ol&gt;
</code></pre>
<p><strong>学完能做：</strong> 使用嵌套列表表达步骤与分层任务。</p>
