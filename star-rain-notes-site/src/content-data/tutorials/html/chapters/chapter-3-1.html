<p><strong>核心：</strong> <code>ul</code> 是无序列表、<code>ol</code> 是有序列表；每项都使用 <code>li</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;ul&gt;&lt;li&gt;HTML&lt;/li&gt;&lt;li&gt;CSS&lt;/li&gt;&lt;/ul&gt;
&lt;ol&gt;&lt;li&gt;安装编辑器&lt;/li&gt;&lt;li&gt;创建文件&lt;/li&gt;&lt;/ol&gt;
</code></pre>
<p><strong>学完能做：</strong> 根据内容选择有序或无序列表。</p>
