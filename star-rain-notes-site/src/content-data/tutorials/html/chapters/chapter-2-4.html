<p><strong>核心：</strong> <code>./</code> 当前目录、<code>../</code> 上级目录、<code>/</code> 网站根路径；完整 <code>https://</code> 是绝对 URL。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;a href="./about.html"&gt;同目录&lt;/a&gt;
&lt;img src="../images/logo.png" alt="Logo"&gt;
&lt;a href="https://example.com"&gt;外部网址&lt;/a&gt;
</code></pre>
<p><strong>学完能做：</strong> 区分相对与绝对路径，正确定位资源地址。</p>
