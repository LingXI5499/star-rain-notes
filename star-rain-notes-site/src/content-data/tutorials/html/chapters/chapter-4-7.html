<p><strong>核心：</strong> 原生控件应有可读名称、清晰焦点和可操作的键盘顺序。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;label for="search"&gt;搜索课程&lt;/label&gt;
&lt;input id="search" name="q"&gt;
&lt;button type="button"&gt;提交&lt;/button&gt;
</code></pre>
<p><strong>学完能做：</strong> 确保表单可用键盘操作且控件名称清晰。</p>
