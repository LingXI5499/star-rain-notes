<p><strong>核心：</strong> <code>iframe</code> 可嵌入另一个页面；<code>title</code> 说明内容，<code>sandbox</code> 限制嵌入页权限。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;iframe src="embed.html" title="页面预览" sandbox=""&gt;&lt;/iframe&gt;
</code></pre>
<p><strong>学完能做：</strong> 理解 iframe 的嵌入方式和隔离边界。</p>
