<p><strong>核心：</strong> <code>audio</code>/<code>video</code> 支持 <code>controls</code> 原生控制条；<code>source</code> 提供媒体来源。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-html">&lt;audio controls src="music.mp3"&gt;&lt;/audio&gt;
&lt;video controls width="320" src="demo.mp4"&gt;&lt;/video&gt;
</code></pre>
<p><strong>学完能做：</strong> 嵌入音视频并控制基本播放选项。</p>
