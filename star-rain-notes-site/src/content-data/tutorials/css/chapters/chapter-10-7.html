<p><strong>核心：</strong> 瀑布流让不同高度的卡片紧凑排布；简单视觉示例可使用 CSS 多列。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.masonry { columns: 3 220px; column-gap: 16px; }
.masonry &gt; article { break-inside: avoid; margin-bottom: 16px; }
</code></pre>
<p><strong>学完能做：</strong> 识别瀑布流视觉特点及实现局限。</p>
