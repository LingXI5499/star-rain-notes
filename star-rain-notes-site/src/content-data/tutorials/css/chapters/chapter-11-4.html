<p><strong>核心：</strong> 卡片由封面、标题、元信息、角标组成；可使用相对/绝对定位叠加状态角标。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.course-card { position: relative; }
.course-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.course-card .badge { position: absolute; top: 8px; right: 8px; }
</code></pre>
<p><strong>学完能做：</strong> 设计课程卡片的封面、信息与状态角标。</p>
