<p><strong>核心：</strong> 分屏工作区常见“编辑 / 预览”，左右两个区域可并排且独立滚动。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.workspace { display: grid; grid-template-columns: 1fr 1fr; height: 100dvh; }
.workspace &gt; section { overflow: auto; min-width: 0; }
</code></pre>
<p><strong>学完能做：</strong> 创建两侧并排的编辑与预览工作区。</p>
