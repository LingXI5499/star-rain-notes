<p><strong>核心：</strong> 骨架屏可使用渐变位移、透明度动画或呼吸效果表示加载中。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.skeleton { background: #ddd; animation: breathe 1s ease-in-out infinite alternate; }
@keyframes breathe { to { opacity: .45; } }
</code></pre>
<p><strong>学完能做：</strong> 实现加载骨架屏及轻量呼吸反馈。</p>
