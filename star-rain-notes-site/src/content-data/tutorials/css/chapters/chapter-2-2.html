<p><strong>核心：</strong> 常用权重比较：ID &gt; 类/属性/伪类 &gt; 标签/伪元素；继承值不与直接指定值竞争。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">#title { color: red; } /* ID */
.title { color: blue; } /* class */
h1 { color: black; } /* 标签 */
</code></pre>
<p><strong>学完能做：</strong> 按 ID、类/伪类、元素三类比较选择器权重。</p>
