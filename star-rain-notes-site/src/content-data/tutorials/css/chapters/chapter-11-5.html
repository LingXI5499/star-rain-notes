<p><strong>核心：</strong> 通过 <code>transform</code> 与 <code>box-shadow</code> 组合悬停反馈，附加详情可用透明度过渡。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.product-card { transition: transform .2s, box-shadow .2s; }
.product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px #0002; }
</code></pre>
<p><strong>学完能做：</strong> 实现悬停上浮、阴影和附加信息展示。</p>
