<p><strong>核心：</strong> <code>calc()</code> 算表达式、<code>min()</code> 取小、<code>max()</code> 取大、<code>clamp()</code> 限制最小与最大。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.panel { width: min(90%, 960px); font-size: clamp(16px, 2vw, 24px); }
</code></pre>
<p><strong>学完能做：</strong> 使用数值函数实现可伸缩的尺寸限制。</p>
