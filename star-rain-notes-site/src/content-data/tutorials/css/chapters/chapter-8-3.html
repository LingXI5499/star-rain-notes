<p><strong>核心：</strong> 多个 transform 函数按变换矩阵组合，顺序会影响结果；<code>transform-origin</code> 决定变换原点。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.needle { transform-origin: bottom center; transform: rotate(30deg) translateY(-4px); }
</code></pre>
<p><strong>学完能做：</strong> 理解变换顺序和 transform-origin 的作用。</p>
