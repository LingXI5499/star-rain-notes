<p><strong>核心：</strong> 尺寸计算：<code>content-box</code> 总宽=width+左右 padding+左右 border；<code>border-box</code> 总宽=width。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.a { width: 200px; padding: 10px; border: 2px solid; } /* 占宽224px */
.b { box-sizing: border-box; width: 200px; padding: 10px; border: 2px solid; } /* 200px */
</code></pre>
<p><strong>学完能做：</strong> 计算两种盒模型下元素的实际占位。</p>
