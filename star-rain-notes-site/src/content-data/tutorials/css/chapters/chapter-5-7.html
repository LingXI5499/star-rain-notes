<p><strong>核心：</strong> <code>overflow</code> 控制内容超出盒子后的裁切/滚动，文本省略还需 <code>white-space</code> 等配合。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
</code></pre>
<p><strong>学完能做：</strong> 选择滚动、隐藏、裁切与文本省略策略。</p>
