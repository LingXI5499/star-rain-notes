<p><strong>核心：</strong> 六个面分别通过 <code>rotateX/rotateY</code> 和 <code>translateZ</code> 放到立方体不同方向。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.cube { transform-style: preserve-3d; }
.front { transform: translateZ(50px); }
.back { transform: rotateY(180deg) translateZ(50px); }
.right { transform: rotateY(90deg) translateZ(50px); }
</code></pre>
<p><strong>学完能做：</strong> 通过六个面和三维变换组成立方体。</p>
