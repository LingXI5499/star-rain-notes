<p><strong>核心：</strong> 图文列表可用“固定缩略图 + 弹性正文 + 固定按钮”的 Flex 结构。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.media-row { display: flex; align-items: center; gap: 12px; }
.media-row img { width: 72px; }
.media-row .text { flex: 1; min-width: 0; }
</code></pre>
<p><strong>学完能做：</strong> 制作缩略图、标题正文与尾部操作的列表项。</p>
