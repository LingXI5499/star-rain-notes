<p><strong>核心：</strong> <code>repeat(auto-fit, minmax(...))</code> 根据可用宽度自动决定卡片列数。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
</code></pre>
<p><strong>学完能做：</strong> 实现随容器宽度自动增减列数的卡片。</p>
