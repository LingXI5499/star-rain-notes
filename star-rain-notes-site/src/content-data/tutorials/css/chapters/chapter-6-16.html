<p><strong>核心：</strong> 卡片纵向 <code>flex-direction:column</code>，底部按钮 <code>margin-top:auto</code>，保证各卡片按钮对齐。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.card { display: flex; flex-direction: column; }
.card button { margin-top: auto; }
</code></pre>
<p><strong>学完能做：</strong> 将卡片按钮固定对齐到底部。</p>
