<p><strong>核心：</strong> 标签选全部同类、<code>.class</code> 选分类、<code>#id</code> 选唯一标识、<code>*</code> 选全部、<code>,</code> 合并多个选择器。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">p { color: gray; }
.card { padding: 12px; }
#app { width: 100%; }
* { box-sizing: border-box; }
h1, h2 { color: navy; }
</code></pre>
<p><strong>学完能做：</strong> 使用标签、类、ID、通配和并集选择器。</p>
