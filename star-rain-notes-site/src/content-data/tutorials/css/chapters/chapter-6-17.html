<p><strong>核心：</strong> Grid 能等分列、跨列以及自动排列，用 <code>grid-column:span n</code> 制作大卡片。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.dashboard .featured { grid-column: span 2; }
</code></pre>
<p><strong>学完能做：</strong> 对比等分列、跨列与自动放置的效果。</p>
