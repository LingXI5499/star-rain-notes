<p><strong>核心：</strong> 背景支持多层图像，越靠前的图层越在上面；可用 <code>background-blend-mode</code> 混合背景。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.hero { background-image: linear-gradient(#0005, #0005), url(hero.jpg); background-size: cover; }
</code></pre>
<p><strong>学完能做：</strong> 叠加背景图片、颜色和混合效果。</p>
