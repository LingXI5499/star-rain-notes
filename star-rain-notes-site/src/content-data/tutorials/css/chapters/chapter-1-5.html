<p><strong>核心：</strong> 空格选任意后代、<code>&gt;</code> 选直接子元素；<code>,</code> 是并集，<code>.a.b</code> 是同时满足两个类的交集。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.card p { color: gray; }
.card &gt; p { font-weight: bold; }
.btn.primary { background: blue; }
h2, h3 { margin: 0; }
</code></pre>
<p><strong>学完能做：</strong> 区分后代、直接子代、并集与复合选择。</p>
