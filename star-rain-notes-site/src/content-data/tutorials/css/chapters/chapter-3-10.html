<p><strong>核心：</strong> 边框 <code>border</code>、圆角 <code>border-radius</code>、阴影 <code>box-shadow</code> 是常用卡片视觉属性。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.card { border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 4px 12px #0002; }
</code></pre>
<p><strong>学完能做：</strong> 组合边框、圆角、盒阴影和文字阴影。</p>
