<p><strong>核心：</strong> <code>transition</code> 用于状态变化过渡；<code>@keyframes</code> 配合 <code>animation</code> 制作自主播放动画。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.box { transition: transform .2s; }
.box:hover { transform: scale(1.1); }
@keyframes blink { to { opacity: .3; } }
</code></pre>
<p><strong>学完能做：</strong> 区分 transition 与关键帧 animation 的使用场景。</p>
