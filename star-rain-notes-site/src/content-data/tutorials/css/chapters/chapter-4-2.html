<p><strong>核心：</strong> 盒模型由内容 <code>content</code>、内边距 <code>padding</code>、边框 <code>border</code>、外边距 <code>margin</code> 组成。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.box { width: 200px; padding: 10px; border: 2px solid; margin: 8px; }
</code></pre>
<p><strong>学完能做：</strong> 区分内容、内边距、边框和外边距。</p>
