<p><strong>核心：</strong> 伪类 <code>:hover</code> 选择状态，伪元素 <code>::before</code>/<code>::after</code> 选择生成的装饰内容。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">button:hover { background: orange; }
h2::before { content: "★ "; }
</code></pre>
<p><strong>学完能做：</strong> 识别交互状态伪类和内容伪元素。</p>
