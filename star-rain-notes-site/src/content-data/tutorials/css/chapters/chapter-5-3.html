<p><strong>核心：</strong> <code>display</code> 决定布局方式：<code>none</code> 不生成布局盒，<code>flex</code> 和 <code>grid</code> 开启现代布局。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.hidden { display: none; }
.row { display: flex; gap: 12px; }
</code></pre>
<p><strong>学完能做：</strong> 理解 display 对元素布局参与方式的影响。</p>
