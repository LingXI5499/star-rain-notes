<p><strong>核心：</strong> CSS 可以写在元素 <code>style</code> 属性、页面 <code>&lt;style&gt;</code> 标签或 <code>.css</code> 文件，项目通常优先使用外部文件。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">/* 外部 style.css */
h1 { color: teal; }
/* HTML: &lt;link rel="stylesheet" href="style.css"&gt; */
</code></pre>
<p><strong>学完能做：</strong> 选择行内样式、内嵌样式表或外部文件。</p>
