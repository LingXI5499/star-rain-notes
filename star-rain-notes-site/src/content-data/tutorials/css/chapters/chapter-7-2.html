<p><strong>核心：</strong> <code>fixed</code> 相对视口固定，<code>sticky</code> 在滚动容器的约束范围内吸附。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.topbar { position: sticky; top: 0; background: white; }
.back-top { position: fixed; right: 20px; bottom: 20px; }
</code></pre>
<p><strong>学完能做：</strong> 实现相对定位、固定定位与粘性吸顶。</p>
