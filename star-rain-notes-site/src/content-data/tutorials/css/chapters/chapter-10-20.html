<p><strong>核心：</strong> 聊天窗口外层固定高度，消息区可滚动，输入区留在底部。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.chat { display: flex; flex-direction: column; height: 100dvh; }
.messages { flex: 1; min-height: 0; overflow-y: auto; }
</code></pre>
<p><strong>学完能做：</strong> 实现可滚动消息区和底部固定输入区。</p>
