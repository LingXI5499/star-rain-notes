<p><strong>核心：</strong> 头像固定尺寸、姓名弹性占位、时间靠右，组成消息行。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.message { display: flex; align-items: center; gap: 8px; }
.message .name { flex: 1; }
.message time { margin-left: auto; }
</code></pre>
<p><strong>学完能做：</strong> 对齐头像、姓名与靠右时间信息。</p>
