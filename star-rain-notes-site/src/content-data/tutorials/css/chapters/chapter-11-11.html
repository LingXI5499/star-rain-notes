<p><strong>核心：</strong> 十二列栅格把横向空间均分为 12 份，每个组件控制跨列数量。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.col-4 { grid-column: span 4; }
.col-8 { grid-column: span 8; }
</code></pre>
<p><strong>学完能做：</strong> 理解十二列栅格的划分和跨列规则。</p>
