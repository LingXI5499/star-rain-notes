<p><strong>核心：</strong> 页脚列容器用 <code>flex-wrap</code>，每列给最小宽度，让窄屏自然断行。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.footer-cols { display: flex; flex-wrap: wrap; gap: 24px; }
.footer-cols &gt; section { flex: 1 1 180px; }
</code></pre>
<p><strong>学完能做：</strong> 实现可自动折行的多栏页脚。</p>
