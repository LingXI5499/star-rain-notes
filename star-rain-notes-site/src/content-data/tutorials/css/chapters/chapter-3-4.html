<p><strong>核心：</strong> <code>overflow-wrap</code> 处理长单词，<code>white-space</code> 控制空白与换行，<code>max-width</code> 限制阅读行宽。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">article { max-width: 65ch; line-height: 1.8; overflow-wrap: anywhere; }
</code></pre>
<p><strong>学完能做：</strong> 控制文本折行、长词处理和段落阅读宽度。</p>
