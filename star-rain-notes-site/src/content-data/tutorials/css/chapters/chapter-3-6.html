<p><strong>核心：</strong> <code>background-repeat</code> 控制平铺、<code>background-position</code> 控制位置、<code>cover</code> 填满并可能裁切、<code>contain</code> 完整显示。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.hero { background: url(bg.jpg) center/cover no-repeat; }
</code></pre>
<p><strong>学完能做：</strong> 控制背景图片位置、平铺与缩放策略。</p>
