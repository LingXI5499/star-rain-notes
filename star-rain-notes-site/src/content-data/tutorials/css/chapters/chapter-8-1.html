<p><strong>核心：</strong> <code>:hover</code> 对应鼠标悬浮，<code>:focus-visible</code> 适合显示键盘焦点反馈。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">button:hover { background: #eef; }
button:focus-visible { outline: 2px solid orange; }
</code></pre>
<p><strong>学完能做：</strong> 根据悬浮、焦点等状态切换视觉反馈。</p>
