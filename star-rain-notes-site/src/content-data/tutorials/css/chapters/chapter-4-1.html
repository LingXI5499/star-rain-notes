<p><strong>核心：</strong> <code>px</code> 固定 CSS 像素，<code>rem</code> 依根字号、<code>em</code> 依当前元素字体上下文，<code>vw</code>/<code>vh</code> 依视口。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">html { font-size: 16px; }
h1 { font-size: 2rem; }
section { padding: 2vw; }
</code></pre>
<p><strong>学完能做：</strong> 根据场景选用固定、相对字体和视口单位。</p>
