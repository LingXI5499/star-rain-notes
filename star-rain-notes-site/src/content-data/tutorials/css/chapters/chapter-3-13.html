<p><strong>核心：</strong> 图标可以直接用 <code>&lt;svg&gt;</code> 矢量绘制，样式常由 <code>width</code>、<code>fill</code>、<code>stroke</code> 控制。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">svg.icon { width: 24px; height: 24px; fill: currentColor; }
</code></pre>
<p><strong>学完能做：</strong> 使用 SVG 图标替代依赖字体的图标方案。</p>
