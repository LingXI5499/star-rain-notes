<p><strong>核心：</strong> 固定下载条要考虑移动设备安全区 <code>env(safe-area-inset-bottom)</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.download-bar { position: fixed; bottom: 0; inset-inline: 0; padding-bottom: env(safe-area-inset-bottom); }
</code></pre>
<p><strong>学完能做：</strong> 适配固定底栏与移动设备安全区域。</p>
