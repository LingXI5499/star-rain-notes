<p><strong>核心：</strong> <code>position:relative</code> 让元素相对原位偏移且保留空间；<code>absolute</code> 脱离普通文档流。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.parent { position: relative; }
.badge { position: absolute; top: 0; right: 0; }
</code></pre>
<p><strong>学完能做：</strong> 区分相对定位保留占位和绝对定位脱离文档流。</p>
