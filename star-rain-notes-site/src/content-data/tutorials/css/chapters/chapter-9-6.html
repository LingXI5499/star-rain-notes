<p><strong>核心：</strong> <code>scroll-snap-type</code> 定义吸附方向，子项 <code>scroll-snap-align</code> 定义吸附位置。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
.gallery &gt; img { flex: 0 0 80%; scroll-snap-align: start; }
</code></pre>
<p><strong>学完能做：</strong> 实现滚动吸附的横向内容区。</p>
