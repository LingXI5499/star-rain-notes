<p><strong>核心：</strong> 横竖屏通过 <code>orientation</code> 查询，局部横向滚动可避免表格撑破手机页面。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.table-wrap { overflow-x: auto; }
@media (orientation: landscape) { .hero { min-height: 70vh; } }
</code></pre>
<p><strong>学完能做：</strong> 识别横竖屏切换及局部横向溢出问题。</p>
