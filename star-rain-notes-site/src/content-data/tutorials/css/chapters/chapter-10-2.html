<p><strong>核心：</strong> 用 <code>max-width</code> 限制内容宽度，<code>margin-inline:auto</code> 居中，左右 padding 留出安全间距。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.container { max-width: 1200px; padding-inline: 16px; margin-inline: auto; }
</code></pre>
<p><strong>学完能做：</strong> 设置版心最大宽度与居中留白。</p>
