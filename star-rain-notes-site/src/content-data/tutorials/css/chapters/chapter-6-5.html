<p><strong>核心：</strong> Grid 可同时安排行和列，<code>grid-column</code>/<code>grid-row</code> 控制项目跨越的轨道。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.grid { display: grid; grid-template: repeat(2, 80px) / repeat(3, 1fr); }
.wide { grid-column: span 2; }
</code></pre>
<p><strong>学完能做：</strong> 通过行列规则构建二维网格。</p>
