<p><strong>核心：</strong> <code>:first-child</code>、<code>:last-child</code>、<code>:checked</code>、<code>:focus-visible</code> 可按结构或状态选择元素。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">li:first-child { color: red; }
input:checked { accent-color: green; }
</code></pre>
<p><strong>学完能做：</strong> 根据状态和结构组合常用伪类条件。</p>
