<p><strong>核心：</strong> <code>animation-delay</code> 控制延迟、<code>direction</code> 控制方向、<code>fill-mode</code> 控制结束态、<code>play-state</code> 暂停。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.loader { animation: pulse 1s ease-in-out .2s infinite alternate; }
.loader:hover { animation-play-state: paused; }
</code></pre>
<p><strong>学完能做：</strong> 控制动画延迟、方向、保持状态与暂停。</p>
