<p><strong>核心：</strong> <code>steps(n)</code> 让动画分为离散帧，适合雪碧图逐帧移动。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.sprite { animation: walk 1s steps(4) infinite; }
@keyframes walk { to { background-position: -256px 0; } }
</code></pre>
<p><strong>学完能做：</strong> 使用 steps 制作逐帧动画。</p>
