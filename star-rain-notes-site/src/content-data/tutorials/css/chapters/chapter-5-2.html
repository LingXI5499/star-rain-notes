<p><strong>核心：</strong> <code>block</code> 独占一行、<code>inline</code> 随文字排列、<code>inline-block</code> 行内排列且可设宽高。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.block { display: block; }
.inline { display: inline; }
.inline-block { display: inline-block; width: 80px; }
</code></pre>
<p><strong>学完能做：</strong> 比较三种常见 display 类型的排布行为。</p>
