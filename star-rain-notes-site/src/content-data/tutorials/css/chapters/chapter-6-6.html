<p><strong>核心：</strong> <code>grid-template-areas</code> 给版块起名字，子项用 <code>grid-area</code> 放到指定区域。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.page { display: grid; grid-template-areas: "head head" "side main"; }
header { grid-area: head; }
aside { grid-area: side; }
main { grid-area: main; }
</code></pre>
<p><strong>学完能做：</strong> 用命名区域表达页面分区关系。</p>
