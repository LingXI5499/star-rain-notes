<p><strong>核心：</strong> 链接状态常见顺序为 <code>:link</code>、<code>:visited</code>、<code>:hover</code>、<code>:active</code>；键盘焦点推荐 <code>:focus-visible</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">a:link { color: blue; }
a:visited { color: purple; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid orange; }
</code></pre>
<p><strong>学完能做：</strong> 设计链接不同状态与可见键盘焦点。</p>
