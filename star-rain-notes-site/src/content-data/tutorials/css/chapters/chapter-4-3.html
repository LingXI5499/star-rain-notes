<p><strong>核心：</strong> <code>content-box</code> 的 <code>width</code> 仅是内容宽；<code>border-box</code> 的 <code>width</code> 包含 padding 和 border。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-css">.box { box-sizing: border-box; width: 200px; padding: 20px; border: 2px solid; }
</code></pre>
<p><strong>学完能做：</strong> 理解 box-sizing 对尺寸计算的影响。</p>
