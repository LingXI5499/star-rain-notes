<h2>本章知识点</h2>
<ul>
<li>参数语义优先于参数写法</li>
<li>value 表示复制 / 转移输入</li>
<li><code>const T&amp;</code> 表示借用只读</li>
<li><code>T&amp;</code> 表示非空可修改借用</li>
<li><code>T*</code> 常用于可空或数组 / C API 边界</li>
<li><code>unique_ptr</code> 参数表达所有权转移</li>
<li><code>shared_ptr</code> 参数不应机械使用</li>
<li>return by value</li>
<li>error result 与 exception 的选择</li>
<li>API contract</li>
<li>让类型系统表达意图</li>
</ul>
