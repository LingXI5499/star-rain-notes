<h2>本章知识点</h2>
<ul>
<li>C++ 标准定义虚函数语义，不要求特定 vtable 实现</li>
<li>vptr / vtable 是主流 ABI 常见实现</li>
<li>name mangling</li>
<li>ABI</li>
<li>object layout</li>
<li>virtual dispatch</li>
<li>compiler explorer / debugger 验证实现</li>
<li>不把“虚表一定在对象开头”写成语言定律</li>
<li>不同编译器 / ABI 可能不同</li>
<li>面试回答要区分“标准语义”和“常见实现”</li>
</ul>
