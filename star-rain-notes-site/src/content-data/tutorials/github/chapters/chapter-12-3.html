<h2>本章知识点</h2>
<ul>
<li>incremental commits</li>
<li>meaningful change</li>
<li>refactor</li>
<li>bug fix</li>
<li>test</li>
<li>docs</li>
<li>feature</li>
<li>migration</li>
<li>release</li>
<li>avoid one giant initial commit for finished project</li>
<li>commit history 不能证明全部能力，但能提供工程过程证据</li>
</ul>
