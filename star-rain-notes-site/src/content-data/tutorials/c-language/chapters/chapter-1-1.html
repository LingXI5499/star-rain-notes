<h2>本章知识点</h2>
<ul>
<li>课程定位：以标准 C 语言、内存模型、指针和工程基础为主线</li>
<li>建议教学基线：ISO C17；C23 作为明确标注的现代特性补充</li>
<li>核心学习路径：语法 → 函数 → 数组/字符串 → 指针 → 聚合类型 → 动态内存 → 预处理/多文件 → 标准库/文件 → 工程与系统视角</li>
<li>C 语言与数据结构、操作系统、嵌入式、Linux/POSIX、C++ 的课程边界</li>
<li>学习方法：手写、编译器警告、调试器、Sanitizer、代码阅读与错误复现</li>
<li>学完后的去向：数据结构与算法、计算机组成/操作系统、嵌入式、Linux 系统编程、C++</li>
</ul>
