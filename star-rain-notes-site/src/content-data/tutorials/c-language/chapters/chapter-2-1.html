<h2>本章知识点</h2>
<ul>
<li>C 语言、Dennis Ritchie、Bell Labs 与 UNIX 的历史关系</li>
<li>C 的过程式、编译型、通用系统编程语言定位</li>
<li>C89/C90、C99、C11、C17、C23 的标准演进</li>
<li>ISO C 标准与 GCC/Clang/MSVC/嵌入式编译器实现的区别</li>
<li>Hosted environment 与 Freestanding environment 的基本区别</li>
<li>C 在操作系统、嵌入式、数据库、网络库、编译器等领域的典型角色</li>
<li>本课程为什么以 C17 为核心、C23 作为补充</li>
</ul>
