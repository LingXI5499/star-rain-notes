<p><strong>核心：</strong> 待办清单用数组保存任务状态，交互操作对应新增、删除、切换完成状态。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">let todos = [{ id: 1, text: '学习 JS', done: false }];
todos.push({ id: 2, text: '练习', done: false });
todos = todos.filter(x =&gt; x.id !== 1);
</code></pre>
<p><strong>学完能做：</strong> 完成待办事项的新增、删除与完成。</p>
