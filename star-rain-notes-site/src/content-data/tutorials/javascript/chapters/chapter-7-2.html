<p><strong>核心：</strong> 闭包让内部函数持续访问其定义时外部作用域中的变量，可封装独立状态。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">function counter() {
  let n = 0;
  return () =&gt; ++n;
}
const add = counter(); console.log(add(), add()); // 1 2
</code></pre>
<p><strong>学完能做：</strong> 使用闭包封装独立且持续存在的状态。</p>
