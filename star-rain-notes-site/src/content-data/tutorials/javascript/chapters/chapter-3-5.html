<p><strong>核心：</strong> <code>includes</code> 判断是否包含，<code>indexOf</code> 查下标，数字排序应传比较函数。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const a = [10, 2, 8];
console.log(a.includes(2)); // true
console.log(a.sort((x, y) =&gt; x - y)); // [2,8,10]
</code></pre>
<p><strong>学完能做：</strong> 正确选择查找、条件判断和数字排序方法。</p>
