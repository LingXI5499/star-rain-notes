<p><strong>核心：</strong> <code>break</code> 立即退出循环、<code>continue</code> 跳过本次；修改循环变量以免无限循环。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">let n = 0;
while (n &lt; 5) { n++; if (n === 2) continue; if (n === 4) break; console.log(n); }
</code></pre>
<p><strong>学完能做：</strong> 正确控制循环退出、跳过和边界。</p>
