<p><strong>核心：</strong> 明暗主题通过切换根元素上的类或属性，让 CSS 根据状态选择主题色。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const toggle = document.querySelector('#theme');
toggle.onclick = () =&gt; document.documentElement.classList.toggle('dark');
</code></pre>
<p><strong>学完能做：</strong> 切换主题样式并保持页面显示一致。</p>
