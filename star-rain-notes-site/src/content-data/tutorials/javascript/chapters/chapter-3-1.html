<p><strong>核心：</strong> 数组用 <code>[]</code> 存有序数据；<code>push</code> 添加，<code>pop</code> 删除末项，<code>slice</code> 复制片段。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const a = [1, 2];
a.push(3);
const b = a.slice();
console.log(a, b);
</code></pre>
<p><strong>学完能做：</strong> 对数组执行添加、删除和复制操作。</p>
