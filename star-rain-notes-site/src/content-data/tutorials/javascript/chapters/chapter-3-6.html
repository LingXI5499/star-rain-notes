<p><strong>核心：</strong> <code>find</code> 找第一个元素、<code>findIndex</code> 找其下标，<code>some</code> 判断存在、<code>every</code> 判断全部。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const a = [2, 5, 8];
console.log(a.find(x =&gt; x &gt; 4)); // 5
console.log(a.some(x =&gt; x &gt; 7), a.every(x =&gt; x &gt; 0)); // true true
</code></pre>
<p><strong>学完能做：</strong> 按查找目标选择 find、findIndex、some、every。</p>
