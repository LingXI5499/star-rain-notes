<p><strong>核心：</strong> 嵌套循环外层控制行、内层控制列，可生成二维输出。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">for (let i = 1; i &lt;= 3; i++) {
  let line = '';
  for (let j = 1; j &lt;= i; j++) line += `${j}×${i}=${i * j} `;
  console.log(line);
}
</code></pre>
<p><strong>学完能做：</strong> 通过嵌套循环生成二维规律结果。</p>
