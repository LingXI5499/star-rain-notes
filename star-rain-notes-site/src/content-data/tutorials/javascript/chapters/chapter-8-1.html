<p><strong>核心：</strong> 作品集从数据数组出发，按标签筛选后生成列表，点击项目显示详情。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const projects = [{ id: 1, name: '星雨笔录', tag: 'Web' }];
const visible = projects.filter(x =&gt; x.tag === 'Web');
console.log(visible.map(x =&gt; x.name));
</code></pre>
<p><strong>学完能做：</strong> 整合作品数据、筛选状态和详情展示。</p>
