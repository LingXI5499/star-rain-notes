<p><strong>核心：</strong> <code>JSON.stringify</code> 把可序列化的对象转为 JSON 字符串，<code>JSON.parse</code> 反向解析。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const text = JSON.stringify({ name: '小明' });
console.log(JSON.parse(text).name); // 小明
</code></pre>
<p><strong>学完能做：</strong> 在对象和 JSON 字符串之间转换。</p>
