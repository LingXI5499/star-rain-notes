<p><strong>核心：</strong> 全选要同步所有子项，并在部分选中时设置主复选框的 <code>indeterminate</code> 状态。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const all = document.querySelector('#all');
const items = [...document.querySelectorAll('.item')];
all.onclick = () =&gt; { items.forEach(x =&gt; x.checked = all.checked); all.indeterminate = false; };
</code></pre>
<p><strong>学完能做：</strong> 实现全选、部分选中和不确定状态。</p>
