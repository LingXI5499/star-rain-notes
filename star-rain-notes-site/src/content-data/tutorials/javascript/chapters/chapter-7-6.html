<p><strong>核心：</strong> 构造函数通过 <code>new</code> 建立对象、绑定 <code>this</code>，默认返回实例；显式返回对象可覆盖默认实例。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">function User(name) { this.name = name; }
const u = new User('小明');
console.log(u.name);
</code></pre>
<p><strong>学完能做：</strong> 理解 new 创建实例与构造函数返回值特例。</p>
