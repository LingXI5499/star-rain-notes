<p><strong>核心：</strong> <code>break</code> 结束 switch 分支或循环；<code>return</code> 结束整个函数并返回结果。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">function type(n) {
  switch (n) { case 1: return '一'; default: return '其他'; }
}
console.log(type(1));
</code></pre>
<p><strong>学完能做：</strong> 区分 switch 终止分支与函数结束。</p>
