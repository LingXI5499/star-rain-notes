<p><strong>核心：</strong> <code>textContent</code> 改文字、<code>setAttribute</code> 改属性、<code>classList</code> 改样式类、<code>value</code> 读输入值。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const el = document.querySelector('#title');
el.textContent = '新标题';
el.classList.add('active');
el.setAttribute('title', '提示');
</code></pre>
<p><strong>学完能做：</strong> 读取与修改文本、属性、类名和控件状态。</p>
