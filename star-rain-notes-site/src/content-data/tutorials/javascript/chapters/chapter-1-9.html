<p><strong>核心：</strong> 模板字面量用反引号和 <code>${表达式}</code> 拼接文本；字符串方法可完成基本搜索。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const name = '小明';
console.log(`你好，${name}`);
console.log('JavaScript'.includes('Script')); // true
</code></pre>
<p><strong>学完能做：</strong> 使用模板字符串组织可读的动态文本。</p>
