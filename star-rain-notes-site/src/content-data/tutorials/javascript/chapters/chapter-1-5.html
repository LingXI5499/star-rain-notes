<p><strong>核心：</strong> <code>Number()</code>、<code>String()</code>、<code>Boolean()</code> 显式转换；<code>NaN</code> 表示无法得到有效数字。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const age = Number('18');
const bad = Number('abc');
console.log(age, Number.isNaN(bad)); // 18 true
</code></pre>
<p><strong>学完能做：</strong> 显式处理输入类型并识别 NaN。</p>
