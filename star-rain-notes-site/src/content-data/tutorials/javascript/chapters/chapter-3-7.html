<p><strong>核心：</strong> <code>map</code> 一对一映射、<code>filter</code> 筛选、<code>reduce</code> 把多项汇总成一个结果。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const a = [1, 2, 3, 4];
console.log(a.filter(x =&gt; x % 2 === 0).map(x =&gt; x * 10)); // [20,40]
</code></pre>
<p><strong>学完能做：</strong> 使用 map、filter、reduce 处理数据集合。</p>
