<p><strong>核心：</strong> <code>split</code> 拆分、<code>slice</code> 截取、<code>indexOf</code> 查找、<code>replace</code> 替换字符串内容。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const text = 'HTML,CSS,JS';
console.log(text.split(',')); // ['HTML','CSS','JS']
console.log(text.slice(0, 4), text.replace('JS', 'JavaScript'));
</code></pre>
<p><strong>学完能做：</strong> 完成字符串拆分、查找、截取和替换。</p>
