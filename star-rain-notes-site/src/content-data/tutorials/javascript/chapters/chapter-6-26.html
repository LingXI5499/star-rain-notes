<p><strong>核心：</strong> <code>location</code> 表示当前地址，<code>navigator</code> 暴露浏览器能力，<code>location.search</code> 提供 URL 查询串。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const params = new URLSearchParams(location.search);
console.log(params.get('keyword'));
console.log(navigator.language);
</code></pre>
<p><strong>学完能做：</strong> 读取地址栏、浏览器信息及查询参数。</p>
