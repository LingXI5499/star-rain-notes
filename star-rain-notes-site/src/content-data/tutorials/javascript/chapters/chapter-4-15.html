<p><strong>核心：</strong> <code>append</code>、<code>before</code>、<code>replaceWith</code>、<code>cloneNode</code>、<code>remove</code> 分别负责插入、替换、复制、删除节点。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const old = document.querySelector('#old');
const next = document.createElement('p');
next.textContent = '替换成功';
old.replaceWith(next);
</code></pre>
<p><strong>学完能做：</strong> 使用 DOM API 实现插入、替换和复制。</p>
