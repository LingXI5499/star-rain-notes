<p><strong>核心：</strong> <code>Promise</code> 表示未来完成的结果，成功用 <code>resolve/then</code>、失败用 <code>reject/catch</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const task = Promise.resolve('完成');
task.then(value =&gt; console.log(value)).catch(console.error);
</code></pre>
<p><strong>学完能做：</strong> 理解 Promise 的成功、失败和链式处理。</p>
