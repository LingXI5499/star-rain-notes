<p><strong>核心：</strong> <code>let/const</code> 的块作用域限于 <code>{}</code>；<code>var</code> 存在提升；<code>let/const</code> 声明前处于暂时性死区。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">{ let x = 1; console.log(x); }
// console.log(x); // 块外访问报错
</code></pre>
<p><strong>学完能做：</strong> 区分变量提升、块级作用域与暂时性死区。</p>
