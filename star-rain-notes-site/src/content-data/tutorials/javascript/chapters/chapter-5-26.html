<p><strong>核心：</strong> <code>devicePixelRatio</code> 反映 CSS 像素与设备像素的比值；高分屏图片需要足够的源像素。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const dpr = window.devicePixelRatio || 1;
console.log(`100 CSS像素约对应 ${100 * dpr} 设备像素`);
</code></pre>
<p><strong>学完能做：</strong> 理解设备像素比对图像清晰度的影响。</p>
