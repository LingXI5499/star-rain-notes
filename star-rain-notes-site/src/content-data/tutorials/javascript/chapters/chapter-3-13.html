<p><strong>核心：</strong> <code>Map</code> 可用多种类型的键，<code>Set</code> 保存不重复的值。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const map = new Map([['id', 1]]);
const unique = [...new Set([1, 1, 2])];
console.log(map.get('id'), unique); // 1 [1,2]
</code></pre>
<p><strong>学完能做：</strong> 使用 Map 保存键值映射、Set 消除重复。</p>
