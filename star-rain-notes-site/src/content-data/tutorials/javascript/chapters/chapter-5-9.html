<p><strong>核心：</strong> 价格范围筛选需要同时判断最小值与最大值，并避免直接修改原始数组。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const goods = [{ name: 'A', price: 30 }, { name: 'B', price: 80 }];
const visible = goods.filter(g =&gt; g.price &gt;= 20 &amp;&amp; g.price &lt;= 50);
console.log(visible);
</code></pre>
<p><strong>学完能做：</strong> 按最小与最大价格筛选商品。</p>
