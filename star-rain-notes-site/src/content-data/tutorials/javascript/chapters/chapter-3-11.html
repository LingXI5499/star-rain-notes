<p><strong>核心：</strong> <code>Object.keys/values/entries</code> 分别得到键、值、键值对；<code>Object.assign</code> 可合并属性。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const u = { name: '小明', age: 20 };
console.log(Object.keys(u), Object.values(u));
console.log(Object.entries(u));
</code></pre>
<p><strong>学完能做：</strong> 遍历对象属性及合并对象数据。</p>
