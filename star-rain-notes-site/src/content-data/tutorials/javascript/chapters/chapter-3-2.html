<p><strong>核心：</strong> <code>push/pop</code> 操作末尾，<code>unshift/shift</code> 操作开头，<code>splice</code> 可在任意位置增删。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const a = ['A', 'C'];
a.splice(1, 0, 'B'); // 下标1插入
console.log(a); // ['A','B','C']
</code></pre>
<p><strong>学完能做：</strong> 理解不同数组变更方法影响的位置。</p>
