<p><strong>核心：</strong> <code>Date</code> 保存时间；<code>Intl.DateTimeFormat</code> 按地区格式化显示日期。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const now = new Date();
console.log(new Intl.DateTimeFormat('zh-CN', { dateStyle: 'long' }).format(now));
</code></pre>
<p><strong>学完能做：</strong> 创建日期并进行地区化格式输出。</p>
