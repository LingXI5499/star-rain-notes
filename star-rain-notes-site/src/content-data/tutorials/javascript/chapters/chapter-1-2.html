<p><strong>核心：</strong> <code>typeof</code> 用来检查值的类型；<code>null</code> 表示显式空值，<code>undefined</code> 通常表示尚未赋值。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">let x;
console.log(typeof x); // 'undefined'
console.log(x === undefined, null === undefined); // true false
</code></pre>
<p><strong>学完能做：</strong> 识别基本数据类型、typeof 结果与空值。</p>
