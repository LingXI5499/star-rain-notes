<p><strong>核心：</strong> 表格可直接通过 <code>insertRow</code>、<code>insertCell</code>、<code>deleteRow</code> 更新数据行。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const table = document.querySelector('table');
const row = table.insertRow();
row.insertCell().textContent = '新增记录';
</code></pre>
<p><strong>学完能做：</strong> 通过表格 DOM API 添加或删除数据行。</p>
