<p><strong>核心：</strong> <code>^/$</code> 表示首尾，<code>[]</code> 表字符组，<code>+</code> 表至少一次，<code>{n}</code> 表固定次数。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const pattern = /^[A-Za-z]{2,6}\d+$/;
console.log(pattern.test('Abc123')); // true
</code></pre>
<p><strong>学完能做：</strong> 理解字符集合、数量与匹配边界。</p>
