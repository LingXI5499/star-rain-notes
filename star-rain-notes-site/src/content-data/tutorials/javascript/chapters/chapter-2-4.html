<p><strong>核心：</strong> <code>for</code> 适合有计数器的循环，<code>while</code> 适合条件重复，<code>for...of</code> 遍历可迭代值。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">for (let i = 0; i &lt; 3; i++) console.log(i);
for (const x of ['A', 'B']) console.log(x);
</code></pre>
<p><strong>学完能做：</strong> 选择合适循环遍历范围或可迭代数据。</p>
