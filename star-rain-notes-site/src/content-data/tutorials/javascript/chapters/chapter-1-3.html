<p><strong>核心：</strong> JS 有 7 种原始类型加 Object 对象类型；字符串等原始值可临时使用包装对象方法。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const s = 'abc';
console.log(s.toUpperCase()); // 'ABC'
console.log(typeof 1n, typeof Symbol('id')); // bigint symbol
</code></pre>
<p><strong>学完能做：</strong> 理解七种原始类型和对象类型及包装行为。</p>
