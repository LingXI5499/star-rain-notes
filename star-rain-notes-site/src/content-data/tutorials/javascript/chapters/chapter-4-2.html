<p><strong>核心：</strong> <code>querySelector</code> 查询元素，<code>createElement</code> 创建元素，<code>append</code> 插入，<code>remove</code> 删除。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const p = document.createElement('p');
p.textContent = '新段落';
document.body.append(p);
p.remove();
</code></pre>
<p><strong>学完能做：</strong> 查找指定节点并动态创建或移除元素。</p>
