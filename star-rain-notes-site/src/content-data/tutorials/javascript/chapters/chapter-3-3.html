<p><strong>核心：</strong> 遍历数组累计总和；平均值是总和除以数量，最大值可用 <code>Math.max</code>。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const a = [3, 6, 9];
const sum = a.reduce((s, x) =&gt; s + x, 0);
console.log(sum / a.length, Math.max(...a)); // 6 9
</code></pre>
<p><strong>学完能做：</strong> 使用遍历计算合计、平均和极值。</p>
