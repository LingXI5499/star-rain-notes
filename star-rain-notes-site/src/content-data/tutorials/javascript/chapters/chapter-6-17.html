<p><strong>核心：</strong> 将时、分、秒转换成角度，可实现指针时钟；定时读取当前日期。</p>
<p><strong>最小示例：</strong></p>
<pre><code class="language-js">const now = new Date();
const secondsAngle = now.getSeconds() * 6;
const minutesAngle = now.getMinutes() * 6;
console.log(secondsAngle, minutesAngle);
</code></pre>
<p><strong>学完能做：</strong> 将时间转换成钟针角度并持续更新。</p>
