<h2>企业应用的网络请求路径</h2>
<ul><li>常见请求链路：客户端 → DNS/CDN → 负载均衡 → 反向代理/网关 → 应用服务 → 数据库、缓存或下游服务。</li><li>正向代理、反向代理、负载均衡、API 网关与 CDN 的区别。</li><li>四层负载均衡与七层负载均衡的基本差异。</li><li>Nginx 反向代理、TLS 终止、请求转发与上游连接管理。</li><li>公网、私网、服务监听地址、安全组、防火墙与端口开放。</li><li>请求经过多个服务时，客户端看到的错误与真正故障位置可能不同。</li><li>DNS、连接池、代理与负载均衡对服务变更和流量分配的影响。</li></ul>
