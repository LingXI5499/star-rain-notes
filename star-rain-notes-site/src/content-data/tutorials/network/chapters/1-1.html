<h2>计算机网络与分层模型</h2>
<ul><li>计算机网络的作用：通信、资源共享、远程访问与服务调用。</li><li>局域网（LAN）、广域网（WAN）、互联网；客户端、服务端与对等通信。</li><li>OSI 七层模型、TCP/IP 四层模型、常见五层教学模型及其对应关系。</li><li>各层的职责、分层的意义，以及协议如何协同工作。</li><li>常见协议与所在层：HTTP、DNS、TLS、TCP、UDP、IP、ICMP、ARP、Ethernet。</li><li>协议、地址、端口、网卡接口、Socket 等基本概念。</li><li>如何用分层思路定位问题：现象、证据、可能故障层次与下一步验证。</li></ul>
