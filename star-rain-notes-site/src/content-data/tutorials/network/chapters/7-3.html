<h2>网络性能与可观测性</h2>
<ul><li>带宽、吞吐量、RTT、请求延迟分位数（P50/P95/P99）、丢包率与重传率。</li><li>DNS、TCP 建连、TLS 握手、服务端处理与响应下载的耗时拆分。</li><li>并发连接数、文件描述符、线程数、事件循环和网络带宽对容量的影响。</li><li>慢请求、连接池耗尽、超时率升高与错误率升高的常见关联。</li><li>日志、指标、分布式追踪与抓包证据如何配合定位问题。</li><li>连接数、队列长度、超时率、重试率、吞吐量与延迟的观测价值。</li><li>通过对比故障前后指标定位性能回归。</li><li>如何区分网络延迟、服务端处理慢与下游依赖慢。</li></ul>
