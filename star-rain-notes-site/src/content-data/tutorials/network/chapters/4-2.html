<h2>常见网络基础协议与服务</h2>
<ul><li>ICMP：错误报告与网络诊断。</li><li>DHCP：自动获取网络配置。</li><li>NTP：时间同步；系统时间错误对 TLS 证书校验和日志分析的影响。</li><li>SSH：远程安全登录与命令执行。</li><li>SMTP、IMAP：邮件发送与收取的基本用途。</li><li>FTP 与 SFTP 的区别及明文传输风险。</li><li>常见协议端口、协议职责与安全使用边界。</li><li>CDN 的基本作用：缓存、就近分发和降低源站压力。 ------------------------------------------------------------------------</li></ul>
