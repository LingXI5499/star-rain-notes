<h2>超时、重试、连接池与可靠调用</h2>
<ul><li>连接超时、连接池获取超时、TLS 握手超时、读取超时与总调用期限（deadline）。</li><li>TCP Keepalive、应用层心跳、HTTP 持久连接与代理空闲超时的区别。</li><li>连接池的作用、连接复用、池大小、空闲连接回收与连接泄漏。</li><li>有限重试、指数退避、随机抖动与重试风暴。</li><li>非幂等请求的重试风险；幂等键、状态查询与重复副作用控制。</li><li>限流、熔断、并发上限、背压与降级的基本作用。</li><li>外部 API 调用的超时、连接池、错误分类、日志和指标。</li><li>如何为一次跨多个服务的调用设置合理的整体时间预算。</li></ul>
