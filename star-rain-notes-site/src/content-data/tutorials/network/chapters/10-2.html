<h2>Python HTTP 客户端与 TLS</h2>
<ul><li>标准库 `urllib.request`、`http.client` 的用途与边界。</li><li>Requests、HTTPX、aiohttp 的基本定位与选型思路。</li><li>URL、请求方法、请求头、JSON、状态码与异常。</li><li>连接超时、读取超时、总超时、连接复用与响应资源关闭。</li><li>`ssl` 模块、TLS 上下文、证书验证与安全默认配置。</li><li>重试、幂等、错误分类、响应校验与日志记录。</li><li>调用外部 API 时的限流、超时、有限重试与错误处理。</li><li>第三方 HTTP 库在连接池、超时和重试语义上的差异。</li></ul>
